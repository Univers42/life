# Bottom-wall bounce, synchronized: 4 LWSS spaceships descend toward
# the bottom wall and each collapses into a single glider on impact,
# exactly like wall_bounce.cfg - but here all 4 escape in the SAME
# diagonal direction (up-right) instead of a mixed spray.
# The escape direction turns out to depend only on the parity of the
# ship's row (y) at the moment it touches the wall (verified by
# simulation across many phases: even y -> escapes right, odd y ->
# escapes left). All 4 ships here start on an even row, so all 4
# bounce the same way. Lanes are ordered left-to-right = latest-to-
# earliest bounce, so an earlier lane's outgoing glider (moving right)
# always clears a later lane's column before that lane's ship arrives
# - verified by simulation to produce zero collisions between ships.
rule=B3/S23
cell_size=4
speed_ms=20
edge=cylinder
