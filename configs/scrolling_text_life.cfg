# A scrolling marquee: the word "LIFE" in a 5x7 dot-matrix font,
# with every lit pixel replaced by a full lightweight spaceship
# (LWSS) instead of a static block or an in-place oscillator. All 58
# ships are the exact same shape (this repo's own verified LWSS, see
# spaceship.cfg), placed in identical phase, so they all move right
# at the same c/2 speed and never change position relative to each
# other - the whole word translates rightward as one rigid formation
# instead of blinking in place. edge=cylinder wraps the board
# horizontally (and only horizontally - vertically it's a normal
# finite boundary), so once the text scrolls off the right side it
# reappears on the left and keeps going, forever, like an actual LED
# sign.
# Verified by simulation on a matching cylinder (x wraps, y doesn't):
# population stays exactly 58 x 9 = 522 with the letters' relative
# shape fully intact, and the whole formation's position matches the
# predicted +2 columns/period (mod board width) exactly, for 30
# periods (120 generations) straight, including several full
# wrap-arounds past the right edge.
rule=B3/S23
cell_size=3
speed_ms=40
edge=cylinder
PATTERN
