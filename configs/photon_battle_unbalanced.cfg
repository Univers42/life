# Photon battle, unbalanced: two p4 photon guns (see photon_gun.cfg) per
# side - 4 guns total, stacked as two independent head-on pairs - each
# pair firing straight across the SAME row at each other, instead of the
# 2-row vertical offset photon_battle.cfg uses to make its pair interlock
# into a stable standing wave.
# That offset is not cosmetic: photon_battle.cfg's own notes warn that a
# naive same-row placement ignites an uncontrolled chaotic reaction. This
# config is exactly that case, deliberately, for both pairs at once - an
# unbalanced fight where nothing settles down.
# Verified by direct simulation of B25/S45 on this 900x46 finite board:
# population grows from 504 to ~3860 by gen 500 as the fronts (roughly
# 815 cells apart per pair) collide around gen 400-450, then keeps
# climbing past 11000 by gen 900 as the reaction spreads. No periodicity:
# generations 500/900, 600/1000 and 800/1200 are all bit-for-bit
# different. By gen 1200 the chaos has spread through the entire board
# (all 46 rows, all 900 columns) and swallowed all 4 guns.
# edge=finite: no wraparound is involved in any of the above.
# https://entropymine.com/jason/life/alt/guns/b2__5__+s____45+++.lif
rule=B25/S45
cell_size=2
speed_ms=5
edge=finite
