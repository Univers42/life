# Same perpetual gun-vs-eater setup as cannon_eater.cfg, but scaled
# up: double the field (88x56 cells vs 44x28) and the eater1 pushed
# much farther down the glider stream, so several gliders are visibly
# in flight across the open field at once before each one reaches the
# eater and gets absorbed.
# The Gosper glider gun fires southeast forever; the eater1 (fishhook)
# sits directly on that diagonal, pixel-verified from the official
# LifeWiki lexicon image. Moving the eater this far out was verified
# by simulation, not assumed: the catch geometry only depends on the
# eater sitting on the glider's exact flight line with the right
# phase, and a fresh 600-generation / 15+ firing-cycle run confirms
# population still settles to a constant value (58, vs 48 at the
# closer distance - the extra 10 cells are the 2 extra gliders now
# mid-flight at any moment) with edge=finite, this engine boundary.
rule=B3/S23
cell_size=12
speed_ms=25
edge=finite
