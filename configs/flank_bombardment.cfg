# Perpendicular bombardment: a column of 10 LWSS spaceships (the
# lightweight spaceship rotated 90 degrees) descends vertically
# hugging the right edge, while 8 Gosper glider guns, grouped
# together against the left edge, fire gliders diagonally southeast
# that cross the ships' path at a right angle, bombarding them
# relentlessly. Compact vertical layout, no wasted empty space on
# either side.
# Verified by simulation: the guns are periodic (fire every 30
# generations), the ships are valid spaceships (period 4, move 2
# cells every 4 generations); the first collisions happen around
# generation 300 and activity keeps growing afterward.
rule=B3/S23
cell_size=2
speed_ms=20
edge=finite
