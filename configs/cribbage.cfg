# Cribbage: a period-19 oscillator found by Mitchell Riley on July 14,
# 2023 using CatForce - the first period-19 oscillator ever discovered.
# Its name refers to the card game, where 19 is famously the smallest
# score impossible to make in a single hand ("nineteen" = zero points).
# Until this find, period 19 was one of the last two missing oscillator
# periods (with 41) blocking a full proof that Conway's Game of Life is
# omniperiodic (an oscillator exists for every period). Riley found p41
# soon after, and the completed proof - covering all 43 previously-open
# periods and the construction techniques behind them - was published
# by Riley, Nico Brown and others in December 2023.
# https://conwaylife.com/wiki/Cribbage
# https://arxiv.org/abs/2312.02799
# Verified independently (own Python re-implementation of B3/S23, not
# this project's binary): the 32x21 engine returns to its exact
# starting state every 19 generations, with population holding steady
# at 92 cells throughout - a still-life-like stator around a rotating
# 19-phase mechanism, no gliders emitted.
rule=B3/S23
cell_size=12
speed_ms=100
edge=finite
