# Spaghetti monster (Tim Coe, June 11 2016): the first 3c/7 orthogonal
# spaceship ever found - moves 3 cells every 7 generations, straight up.
# At 702 cells across a 27x137 bounding box it's a real heavyweight next
# to knightship.cfg's Sir Robin (282 cells, 31x79): almost twice as tall
# and 2.5x the population, while still counting as "elementary" (no
# known way to build it from smaller pieces).
# Verified by direct simulation of B3/S23: generation 7 matches
# generation 0 exactly (same 702 cells, same shape) shifted 3 rows up,
# and the population cycles through the same 7 values (702, 747, 726,
# 708, 738, 739, 751) for 30 periods straight, including across the
# point where it wraps top-to-bottom.
# edge=torus: with pure vertical motion and no horizontal drift, it
# just keeps flying up and re-entering from the bottom forever - unlike
# the knightships in this collection, which drift diagonally and can
# only loop a torus by accident, if at all.
# https://conwaylife.com/wiki/Spaghetti_monster
rule=B3/S23
cell_size=5
speed_ms=40
edge=projective
