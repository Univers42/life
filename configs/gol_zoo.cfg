# A small zoo: everything this repo has built up in one field, fit
# to exactly 1800x900px. Top: the three classic orthogonal ships
# (LWSS, MWSS, HWSS) cruising past each other on separate lanes -
# LWSS heading right, MWSS and HWSS heading left. Center: a lone
# pulsar (period-3 oscillator) sitting still, plus four free gliders
# drifting southeast through the open middle. Bottom corners: two
# Gosper glider guns, mirror images of each other, firing outward
# (southeast / southwest) so their streams never cross.
# I looked for an existing single-file "zoo" pattern online first
# (conwaylife.com is Cloudflare-blocked for direct fetch, and no
# other source had one clean combined RLE at a fitting size), so
# this is assembled from individually-verified real patterns instead
# of one downloaded file - LWSS/MWSS/HWSS and the Gosper gun the same
# ones proven in this repo's other configs, the pulsar lifted from
# pulsar.cfg and re-verified (exact period-3 return to its start).
# Verified by simulation with edge=finite: no overlaps at placement,
# all three ships still exactly their original cell count after 200
# generations (just translated), both guns firing on schedule with
# bounded, non-exploding growth, streams staying on their own sides.
rule=B3/S23
cell_size=4
speed_ms=25
edge=finite
