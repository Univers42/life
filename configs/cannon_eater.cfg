# A Gosper glider gun fires southeast, forever, into an eater1 (aka
# fishhook) still life placed directly on the glider stream. Every
# glider that arrives gets fully absorbed - the eater takes a brief
# 4-generation hit then heals back to its exact original 7-cell shape
# before the next glider (30 generations later) arrives, so nothing
# ever escapes and nothing ever piles up.
# Both patterns were pixel-verified (the eater1 shape was extracted
# from the official LifeWiki lexicon image, not guessed from memory)
# and the catch geometry was found by brute-force simulation search
# over glider approach offsets, then confirmed perpetual: population
# stays exactly constant across 600 generations / 15+ firing cycles
# with edge=finite, the same boundary rule this engine uses.
rule=B3/S23
cell_size=12
speed_ms=25
edge=finite
