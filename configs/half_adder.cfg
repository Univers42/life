# A real 1-bit binary half-adder: two Boolean logic gates built from
# Gosper-style period-60 glider guns, "eater" catalysts, glider
# reflectors and a glider-duplicator (fanout), wired so gliders carry
# the bits and collisions carry out the logic. Inputs A and B (top,
# both firing here) are each split in two by a duplicator: one branch
# feeds an XOR sub-circuit that computes the Sum bit, the other feeds
# an AND sub-circuit that computes the Carry bit. Each output is
# caught by a plain eater, which absorbs an incoming glider and
# returns to its original 4 cells with no lasting trace - so "does a
# glider arrive" (not "does the population change") is the actual
# signal. With A=1, B=1 (1+1 in binary) the correct answer is
# Sum=0, Carry=1: the XOR eater should stay untouched forever while
# the AND eater keeps getting hit every period.
# Not an original design - transcribed cell-for-cell from Alex
# Bespoyasov's "Binary Adder in the Game of Life"
# (https://github.com/bespoyasov/binary-full-adder-in-the-game-of-life,
# live demo: https://bespoyasov.ru/showcase/game-of-life/), which
# builds this exact half-adder as one stage of a full 2-bit adder.
# conwaylife.com's own logic-gate pages are Cloudflare-blocked for
# direct fetch, so this repo's JS source was cloned and its gate/
# circuit modules re-run directly in Node to get exact, real
# coordinates - not hand-guessed ones.
# Verified: reproduced the same composition and evolution rules
# (B3/S23, plain non-toroidal neighbor counting) independently in
# Python, then cross-checked population-over-time for all 4 AND and
# all 4 XOR input combinations (0,0/1,0/0,1/1,1), every 30
# generations up to 360 - every single one of the 96 sampled
# population counts matched the reference Node run exactly. The
# assembled half-adder(1,1) pattern below has the same initial
# population (805) and bounding box as the reference, and stays
# alive and running (no runaway growth beyond the guns' own steady
# periodic output, no crashes) through 600+ generations.
rule=B3/S23
cell_size=1
speed_ms=15
edge=finite
